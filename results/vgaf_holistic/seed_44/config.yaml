project:
  name: gerhyperg
  seed: 42
  device: cuda:3
data:
  max_persons: 20
  face_size: 260
  body_size: 224
  num_workers: 4
  dataset: vgaf
  fps: 3
  max_frames: 600
  protocol: protocol_a
  video_root: /path/to/datasets/VGAFDATA/VGAF
  cache_root: /path/to/datasets/gerhyperg_features/vgaf
  dev_split_ratio: 0.2
  dev_split_seed: 7
model:
  d_model: 256
  num_classes: 3
  dropout: 0.4
  visual:
    backbone: holistic
    use_pose: true
    num_prototypes: 2
    gat_heads: 4
    per_person_dim: 2048
  audio:
    audio_dim: 1024
  scene:
    scene_dim: 512
  temporal:
    enabled: false
    temporal_dim: 768
  fusion:
    per_class: false
  backbone:
    face_model: enet_b2_8
    body_model: ViT-B-16
    audio_dim: 1024
    text_dim: 0
train:
  optimizer: adamw
  lr: 3.0e-05
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 2
  batch_size: 32
  epochs: 50
  patience: 10
  grad_clip: 1.0
  amp: true
  feature_dropout: 0.1
  loss:
    use_class_weights: true
    aux_loss_weight: 0.3
  branch_dropout: 0.2
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
